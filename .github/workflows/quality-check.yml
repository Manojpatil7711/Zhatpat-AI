name: Website quality checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          required = [
              "index.html",
              "privacy.html",
              "assets/style.css",
              "assets/app.js",
              "robots.txt",
              "sitemap.xml",
              "favicon.svg",
              "tools/image-to-text.html",
              "assets/ocr.js",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          html = Path("index.html").read_text(encoding="utf-8")
          for item in ['<title>Zhatpat AI', 'name="description"', '/assets/style.css', '/assets/app.js']:
              if item not in html:
                  raise SystemExit(f"Homepage check failed: {item}")

          ET.parse("sitemap.xml")
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")
          if "https://zhatpat-ai.dev/tools/image-to-text.html" not in sitemap_text:
              raise SystemExit("OCR tool URL is missing from sitemap")
          if "/assets/ocr.js" not in Path("tools/image-to-text.html").read_text(encoding="utf-8"):
              raise SystemExit("OCR script is not linked from the tool page")
          robots = Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://zhatpat-ai.dev/sitemap.xml" not in robots:
              raise SystemExit("robots.txt sitemap reference is missing")

          class BasicHTMLCheck(HTMLParser):
              pass

          BasicHTMLCheck().feed(html)
          print("Static site checks passed.")
          PY
